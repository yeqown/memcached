version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - revive
    - govet
    - errcheck
    - ineffassign
    - staticcheck
  settings:
    staticcheck:
      # Preserve the former gosimple checks, which moved into staticcheck in v2.
      checks:
        - S*
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: var-naming
          disabled: true
  exclusions:
    generated: lax
    presets: []
    rules:
      - path: (.+)\.go$
        text: "var-naming: avoid package names that conflict with Go standard library"
      - path: (.+)\.go$
        text: "could remove embedded field.*Mutex"
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
