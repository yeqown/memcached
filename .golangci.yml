version: "2"

linters:
  enable:
    - revive
    - govet
    - errcheck
    - ineffassign
  disable:
    - staticcheck
    - unused
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: var-naming
          disabled: true
  exclusions:
    generated: lax
    rules:
      - path: (.+)\.go$
        text: 'var-naming: avoid package names that conflict with Go standard library'
      - path: (.+)\.go$
        text: could remove embedded field.*Mutex

formatters:
  enable:
    - gofumpt

run:
  timeout: 5m
