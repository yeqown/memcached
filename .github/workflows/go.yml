name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Install Go check tools
        shell: bash
        run: |
          set -euo pipefail
          tools_bin="${RUNNER_TEMP}/memcached-go-tools"
          mkdir -p "${tools_bin}"
          echo "${tools_bin}" >> "${GITHUB_PATH}"
          GOBIN="${tools_bin}" go install golang.org/x/tools/cmd/goimports@v0.53.0
          GOBIN="${tools_bin}" go install mvdan.cc/gofumpt@v0.12.0
          GOBIN="${tools_bin}" go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          GOBIN="${tools_bin}" go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          GOBIN="${tools_bin}" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          GOBIN="${tools_bin}" go install github.com/uudashr/gocognit/cmd/gocognit@v1.3.0
          GOBIN="${tools_bin}" go install go.uber.org/nilaway/cmd/nilaway@91ad9bf5d8e6

      - name: Verify module checksums
        run: go mod verify

      - name: Run checks
        run: make check

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26'

    - name: Get dependencies
      run: go mod download

    - name: Run Tests
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Build standalone CLI and verify release version
      working-directory: cmd/memcached-cli
      env:
        GOWORK: 'off'
      run: |
        go build -mod=readonly -ldflags="-X main.version=ci-version-check" ./...
        test "$(./memcached-cli version)" = "memcached-cli version ci-version-check"

    - name: Build standalone examples
      working-directory: example
      env:
        GOWORK: 'off'
      run: |
        for source in *.go; do
          go build -mod=readonly -o "$RUNNER_TEMP/memcached-example" "$source"
        done
        go build -mod=readonly ./SASL ./otel

    - name: Save coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage.txt
        if-no-files-found: error

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      continue-on-error: true
      with:
        files: ./coverage.txt
        flags: unittests
        fail_ci_if_error: true
        use_oidc: true
        use_pypi: true

  integration:
    name: Memcached compatibility
    runs-on: ubuntu-latest
    services:
      memcached:
        image: memcached:1.6.37
        ports:
          - 11211:11211
    env:
      MEMCACHED_TEST_ADDR: 127.0.0.1:11211
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Get dependencies
        run: go mod download

      - name: Check daemon compatibility
        run: go test -v -race -run '^TestMemcachedIntegration$' -count=1 .
