name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint run --timeout=5m ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26'

    - name: Get dependencies
      run: go mod download

    - name: Run Tests
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Save coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage.txt
        if-no-files-found: error

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      continue-on-error: true
      with:
        files: ./coverage.txt
        flags: unittests
        fail_ci_if_error: true
        use_oidc: true
        use_pypi: true

  integration:
    name: Memcached compatibility
    runs-on: ubuntu-latest
    services:
      memcached:
        image: memcached:1.6.37
        ports:
          - 11211:11211
    env:
      MEMCACHED_TEST_ADDR: 127.0.0.1:11211
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Get dependencies
        run: go mod download

      - name: Check daemon compatibility
        run: go test -v -race -run '^TestMemcachedIntegration$' -count=1 .
